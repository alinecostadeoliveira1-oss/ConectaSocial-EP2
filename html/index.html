<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="ConectaSocial - Plataforma de apoio a projetos sociais."
    >

    <link rel="stylesheet" href="../css/style.css">

    <title>ConectaSocial</title>
</head>

<body>

    <header>
        <div class="container header-inner">

            <a
                href="?pagina=inicio"
                class="logo-link"
                aria-label="ConectaSocial - Página inicial"
            >
                <img
                    src="../imagens/logo.png"
                    alt="ConectaSocial - Conectar, Colaborar, Transformar"
                >
            </a>

            <button
                class="menu-toggle"
                type="button"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="menu-principal"
            >
                ☰
            </button>

            <nav
                class="main-nav"
                id="menu-principal"
                aria-label="Navegação principal"
            >
                <ul>

                    <li>
                        <a
                            href="?pagina=inicio"
                            data-route="inicio"
                        >
                            Início
                        </a>
                    </li>

                    <li class="dropdown">

                        <a
                            href="?pagina=projetos"
                            data-route="projetos"
                        >
                            Projetos
                            <span aria-hidden="true">▼</span>
                        </a>

                        <ul class="dropdown-menu">

                            <li>
                                <a
                                    href="?pagina=projetos&projeto=educacao"
                                    data-route="projetos"
                                >
                                    Educação para Todos
                                </a>
                            </li>

                            <li>
                                <a
                                    href="?pagina=projetos&projeto=alimento"
                                    data-route="projetos"
                                >
                                    Alimento Solidário
                                </a>
                            </li>

                            <li>
                                <a
                                    href="?pagina=projetos&projeto=inclusao"
                                    data-route="projetos"
                                >
                                    Inclusão e Oportunidades
                                </a>
                            </li>

                        </ul>

                    </li>

                    <li>
                        <a
                            href="?pagina=cadastro"
                            data-route="cadastro"
                        >
                            Cadastro
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </header>

    <main id="app" aria-live="polite">
        <!-- O conteúdo das páginas será inserido pelo JavaScript. -->
    </main>

    <footer>
        <p>
            &copy; 2026 ConectaSocial. Todos os direitos reservados.
        </p>

        <p>
            Plataforma de apoio a projetos sociais.
        </p>
    </footer>

    <script
        type="module"
        src="../js/app.js"
    ></script>

</body>

</html>
