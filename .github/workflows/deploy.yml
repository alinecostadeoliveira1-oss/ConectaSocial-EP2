name: Deploy ConectaSocial to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp html/index.html _site/index.html
          cp -r css _site/css
          cp -r imagens _site/imagens
          cp -r js _site/js
          sed -i 's#\.\./css/#css/#g' _site/index.html
          sed -i 's#\.\./imagens/#imagens/#g' _site/index.html
          sed -i 's#\.\./js/#js/#g' _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4